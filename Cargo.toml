[package]
name = "layagrep"
version = "0.4.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
hex = "0.4.3"
ignore = "0.4.33"
laya-rs = { version = "0.1.0", default-features = false, features = ["hub"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tree-sitter = "0.27.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin = { version = "0.4.0", path = "vendor/tree-sitter-kotlin" }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = { version = "0.7.3", path = "vendor/tree-sitter-swift" }
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.11"
